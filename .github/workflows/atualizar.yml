name: Atualizar vagas e concursos

on:
  schedule:
    - cron: '0 11 * * *'   # 1x por dia às 08h (horário de Brasília / UTC-3)
  workflow_dispatch:         # disparo manual quando quiser testar

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Coletar vagas e editais (1x/dia)
        run: node scripts/atualizar.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit e push em data.json
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sem alterações em data.json."
          else
            git commit -m "chore: atualização diária de radiologia SP"
            git push
          fi
